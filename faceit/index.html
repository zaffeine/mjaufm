<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>faceit — Mjau FM</title>

    <link rel="stylesheet" href="../faceit/faceit.css">

    <link rel="icon" href="../assets/favicon.png">

</head>

<body>

    <div class="stars"></div>

    <div class="bg">
        <video autoplay muted loop playsinline>
            <source src="../assets/background.webm" type="video/webm">
        </video>
    </div>

<main>

    <h2>Latest Broadcast</h2>

    <div class="faceit-card">

        <img id="avatar" alt="FACEIT Avatar">

        <h3 id="name"></h3>

        <p>
            Level <span id="level"></span>
        </p>

        <p>
            <span id="elo"></span> ELO
        </p>

        <p id="country"></p>

        <a id="profile" target="_blank">
            Visit Profile
        </a>

    </div>

</main>

<script>
fetch("/api/faceit")
    .then(response => response.json())
    .then(data => {

        document.getElementById("avatar").src = data.avatar;

        document.getElementById("name").textContent =
            data.nickname;

        document.getElementById("level").textContent =
            data.games.cs2.skill_level;

        document.getElementById("elo").textContent =
            data.games.cs2.faceit_elo;

        const code = data.country;

const flag =
    code
    .toUpperCase()
    .replace(/./g, c =>
        String.fromCodePoint(127397 + c.charCodeAt())
    );

document.getElementById("country").textContent = flag;
            
        document.getElementById("profile").href =
            data.faceit_url.replace("{lang}", "en");
    });
</script>

</body>

</html>
